name = "friendo-world"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Local dev (default) ---
# `wrangler dev` uses miniflare to simulate D1 and R2 locally.
# No Cloudflare account needed. Data persists in .wrangler/state/.

[[d1_databases]]
binding = "DB"
database_name = "friendo-world"
database_id = "local-dev"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "friendo-assets"

# --- Production ---
# Activate with: wrangler deploy --env production
# Before first use:
#   wrangler d1 create friendo-world
#   wrangler r2 bucket create friendo-assets
# Then paste the real database_id below.

[env.production]
routes = [
  { pattern = "friendo.world/*", zone_name = "friendo.world" },
  { pattern = "*.friendo.world/*", zone_name = "friendo.world" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "friendo-world"
database_id = "REPLACE_WITH_REAL_D1_ID"

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "friendo-assets"
