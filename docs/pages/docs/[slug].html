{% extends "layouts/base.html" %}

{% block title %}{{ post.title }} — {{ site.name }}{% endblock %}

{% block content %}
<article class="doc">
  <span class="doc-kicker label">{{ post.fields.section }}</span>
  <h1 class="doc-title">{{ post.title }}</h1>
  <div class="doc-body">
    {{ post.body|markdown }}
  </div>
</article>
{% endblock %}
