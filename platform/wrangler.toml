name = "friendo-world"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# --- Local dev (default) ---
# `wrangler dev` runs the dispatch Worker locally.
# Platform D1 is local (miniflare). Dispatch connects to the remote `dev` namespace.

[[d1_databases]]
binding = "DB"
database_name = "friendo-world"
database_id = "local-dev"

[[dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "dev"
remote = true

[[r2_buckets]]
binding = "RUNTIME_BUCKET"
bucket_name = "friendo-runtime"

[vars]
DISPATCH_NAMESPACE = "dev"
# Injected into each site Worker so it can call back to redeem platform SSO codes.
PLATFORM_URL = "https://local.friendo.world"
# CF_ACCOUNT_ID and CF_API_TOKEN should be set via `wrangler secret put`

# --- Production ---
# Activate with: wrangler deploy --env production
#
# The apex is a Workers Custom Domain — deploying auto-provisions its DNS record
# and TLS cert. The `*.friendo.world/*` route dispatches tenant subdomains, but on
# the Free plan each site also needs its own proxied DNS record created at
# provision time (proxied wildcard DNS is Enterprise-only).

[env.production]
routes = [
  { pattern = "friendo.world", custom_domain = true },
  { pattern = "*.friendo.world/*", zone_name = "friendo.world" }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "friendo-world"
database_id = "570c7ac6-fb4c-4a61-8301-6efd43cd27c9"

[[env.production.dispatch_namespaces]]
binding = "DISPATCHER"
namespace = "production"

[[env.production.r2_buckets]]
binding = "RUNTIME_BUCKET"
bucket_name = "friendo-runtime"

[env.production.vars]
DISPATCH_NAMESPACE = "production"
PLATFORM_URL = "https://friendo.world"
CF_ACCOUNT_ID = "e6b33d4e3d3fedb38311ab7539341d77"
# Tenant subdomains are handled by one proxied `*.friendo.world` wildcard DNS
# record + the `*.friendo.world/*` route — provisioning creates no per-site DNS.
# CF_API_TOKEN and AUTH_SECRET are set via `wrangler secret put --env production`
