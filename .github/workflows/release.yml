name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build + embed the admin SPA so the released binary has the current UI,
      # regardless of what's committed in runtime/go/admin/spa.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # package-lock.json is gitignored repo-wide, so use install (not ci).
      - run: npm --prefix admin install
      - run: npm run admin

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
