name: test

# Build/vet + the Go test suite (REST/render/splitter regression scenarios) on
# every PR and push to main, plus a check that the committed SPA/SDK bundles are
# current — so nothing merges stale.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... # REST/render/splitter regression + package tests

  bundles-current:
    # The admin SPA + friendo.js SDK are committed and embedded into the binary via
    # go:embed. Fail if the committed bundles are stale vs the source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm ci installs exactly the committed lockfile — an unpinned `npm install`
      # floats the caret ranges and rebuilds different bundles than the committed ones.
      - run: cd admin && npm ci
      - run: npm run admin && npm run sdk
      - name: committed bundles must be current
        run: |
          if ! git diff --quiet -- runtime/go/admin/spa runtime/go/sdk; then
            echo "::error::Committed SPA/SDK bundles are stale. Run 'npm run admin && npm run sdk' and commit."
            git --no-pager diff --stat -- runtime/go/admin/spa runtime/go/sdk
            exit 1
          fi
