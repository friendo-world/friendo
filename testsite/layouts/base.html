<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.name }}</title>

    <!-- The Friendo community SDK. Served by the runtime at /friendo.js — it
         defines the <friendo-auth>, <friendo-comments>, <friendo-reactions>,
         and <friendo-poll> Web Components used below. -->
    <script src="/friendo.js" defer></script>

    <style>
        :root { --ink: #1f2430; --accent: #6d5dfc; --muted: #6b7280; }
        * { box-sizing: border-box; }
        body {
            font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: var(--ink); max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 5rem;
        }
        a { color: var(--accent); }
        header.site { display: flex; justify-content: space-between; align-items: baseline;
            border-bottom: 1px solid #eee; padding-bottom: 1rem; margin-bottom: 2rem; }
        header.site .brand { font-weight: 700; text-decoration: none; color: var(--ink); }
        header.site .admin { font-size: .85rem; }
        article h1, article h2 { line-height: 1.2; }
        .community { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #eee;
            display: flex; flex-direction: column; gap: 1.5rem; }
        .community h2 { font-size: 1.1rem; margin: 0; }
        .signin { background: #f7f7fb; border-radius: 12px; padding: 1rem; }

        /* Theme the SDK Web Components from here via ::part() — the components
           ship almost no styling of their own, so this page owns the look. */
        friendo-comments::part(list) { display: flex; flex-direction: column; gap: .6rem; }
        friendo-comments::part(comment) { border: 1px solid #ececf3; border-radius: 10px; padding: .6rem .8rem; }
        friendo-comments::part(author) { color: var(--accent); font-weight: 600; }
        friendo-comments::part(input) { border-radius: 10px; border: 1px solid #d7d7e2; }
        friendo-comments::part(submit),
        friendo-auth::part(button) {
            background: var(--accent); color: #fff; border: 0;
            border-radius: 999px; padding: .5em 1.1em;
        }
        friendo-reactions::part(button) { border-radius: 999px; border: 1px solid #e3e3ee; }
        friendo-reactions::part(button)[aria-pressed="true"] { background: #efeaff; border-color: var(--accent); }
        friendo-poll::part(bar) { background: #efeaff; }
    </style>
</head>
<body>
    <header class="site">
        <a class="brand" href="/">{{ site.name }}</a>
        <a class="admin" href="/_/">Admin &rarr;</a>
    </header>

    {% block content %}{% endblock %}
</body>
</html>
