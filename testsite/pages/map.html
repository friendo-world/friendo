{% extends "layouts/base.html" %}
{% block content %}
<h1>Post map</h1>
<p>Every published post that declares a <code>location:</code> in its front matter,
plotted on one map. Click a pin to open the post. This is a single
<code>&lt;friendo-map&gt;</code> with no post-id — every post on one map.</p>

<friendo-map></friendo-map>

<p style="margin-top:1.5rem"><a href="/">&larr; Back home</a></p>

<style>
    /* Give the aggregate map a bit more height than the per-post default. */
    friendo-map::part(map) { height: 460px; }
</style>
{% endblock %}
