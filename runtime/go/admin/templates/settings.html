{{define "settings"}}
{{template "nav" .}}
<div class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="mb-6 text-xl font-bold">Settings</h1>

    <h2 class="mb-3 text-sm font-semibold tracking-wide text-gray-500 uppercase">Site</h2>
    <div class="mb-8 rounded-lg bg-white p-6 shadow-sm">
        <dl class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div>
                <dt class="text-xs font-medium text-gray-400 uppercase">Name</dt>
                <dd class="mt-1 text-sm font-medium">{{.SiteName}}</dd>
            </div>
            <div>
                <dt class="text-xs font-medium text-gray-400 uppercase">Collections</dt>
                <dd class="mt-1 text-sm font-medium">{{len .Collections}}</dd>
            </div>
            <div>
                <dt class="text-xs font-medium text-gray-400 uppercase">Users</dt>
                <dd class="mt-1 text-sm font-medium">{{.UserCount}}</dd>
            </div>
        </dl>
        <p class="mt-4 text-xs text-gray-400">Site name and content types are configured in <code class="rounded bg-gray-100 px-1.5 py-0.5">friendo.toml</code>.</p>
    </div>

    <h2 class="mb-3 text-sm font-semibold tracking-wide text-gray-500 uppercase">Your account</h2>
    <div class="rounded-lg bg-white p-6 shadow-sm">
        <dl class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div>
                <dt class="text-xs font-medium text-gray-400 uppercase">Name</dt>
                <dd class="mt-1 text-sm font-medium">{{.User.Name}}</dd>
            </div>
            <div>
                <dt class="text-xs font-medium text-gray-400 uppercase">Email</dt>
                <dd class="mt-1 text-sm font-medium">{{.User.Email}}</dd>
            </div>
            <div>
                <dt class="text-xs font-medium text-gray-400 uppercase">Role</dt>
                <dd class="mt-1">{{roleTag .User.Role}}</dd>
            </div>
        </dl>
        <div class="mt-6 border-t border-gray-100 pt-4">
            <form method="POST" action="/_/logout">
                <button type="submit" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Log out</button>
            </form>
        </div>
    </div>
</div>
{{end}}
