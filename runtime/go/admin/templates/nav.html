{{define "nav"}}
<nav class="flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-gray-200 bg-white px-4 py-3 sm:px-6">
    <span class="font-bold text-gray-900">Friendo</span>
    <a href="/_/" class="text-sm {{if eq .Active "dashboard"}}font-medium text-blue-600{{else}}text-gray-500 hover:text-gray-900{{end}}">Dashboard</a>
    <a href="/_/users" class="text-sm {{if eq .Active "users"}}font-medium text-blue-600{{else}}text-gray-500 hover:text-gray-900{{end}}">Users</a>
    <a href="/_/settings" class="text-sm {{if eq .Active "settings"}}font-medium text-blue-600{{else}}text-gray-500 hover:text-gray-900{{end}}">Settings</a>
    <a href="/" class="text-sm text-gray-500 hover:text-gray-900">View site</a>
    <div class="ml-auto flex items-center gap-3">
        <span class="hidden text-xs text-gray-400 sm:inline">{{.User.Email}}</span>
        <form method="POST" action="/_/logout"><button type="submit" class="rounded border border-gray-300 px-2 py-1 text-xs text-gray-600 hover:bg-gray-50">Log out</button></form>
    </div>
</nav>
{{end}}
