{{define "dashboard"}}
{{template "nav" .}}
<div class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-6">
        <h1 class="text-xl font-bold">Welcome back, {{.User.Name}}</h1>
        <p class="text-sm text-gray-500">Signed in as {{.User.Email}} · {{roleTag .User.Role}}</p>
    </div>
    <h2 class="mb-3 text-sm font-semibold tracking-wide text-gray-500 uppercase">Collections</h2>
    {{range .Collections}}
    <div class="mb-3 flex items-center justify-between rounded-lg bg-white p-4 shadow-sm">
        <div>
            <span class="font-medium">{{.Name}}</span>
            <span class="ml-2 text-xs text-gray-400">{{.Count}} record{{if ne .Count 1}}s{{end}}</span>
        </div>
        <div class="flex gap-2">
            <a href="/_/collections/{{.Name}}" class="rounded bg-blue-600 px-3 py-1 text-xs font-medium text-white hover:bg-blue-700">Browse</a>
            <a href="/_/collections/{{.Name}}/new" class="rounded border border-blue-600 px-3 py-1 text-xs font-medium text-blue-600 hover:bg-blue-50">New</a>
        </div>
    </div>
    {{end}}
</div>
{{end}}
