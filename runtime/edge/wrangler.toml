# Friendo Edge Runtime — Local development config
#
# Run: npm run dev (or wrangler dev)
# Miniflare provides local D1 + R2, no Cloudflare account needed.
# Push testsite: friendo push --target http://localhost:8788

name = "friendo-edge-dev"
main = "index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Bundle .sql files as text so migrations can embed them.
[[rules]]
type = "Text"
globs = ["**/*.sql"]

[vars]
SITE_ID = "testsite"
SITE_NAME = "testsite"

[[d1_databases]]
binding = "DB"
database_name = "friendo-edge-dev"
database_id = "local-dev"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "friendo-edge-assets"
